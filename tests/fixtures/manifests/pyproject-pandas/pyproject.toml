# источник: pandas 3.0.6, pyproject.toml до [tool.setuptools] ([build-system], [project.optional-dependencies] с маркерами и повторами)
[build-system]
# Minimum requirements for the build system to execute.
# See https://github.com/scipy/scipy/pull/12940 for the AIX issue.
requires = [
    "meson-python>=0.17.1,<1",
    "meson>=1.2.1,<2",
    "wheel",
    # "<4", not "<4.0.0a0": a pre-release in the bound makes pip eligible to
    # install Cython pre-releases (that pulled the 3.3.0a1 alpha into 3.0.4).
    "Cython>3.1.0,<4",  # Note: sync with setup.py, environment.yml and asv.conf.json
    # numpy >= 2.0 keeps wheels compatible with numpy 1 and 2. Exclude 2.5.0:
    # wheels built against it segfault on older numpy (GH#66086; numpy GH#31804,
    # fixed in 2.5.1).
    "numpy>=2.0.0,!=2.5.0",
    "versioneer[toml]"
]

build-backend = "mesonpy"

[project]
name = 'pandas'
dynamic = [
  'version'
]
description = 'Powerful data structures for data analysis, time series, and statistics'
readme = 'README.md'
authors = [
  { name = 'The Pandas Development Team', email='pandas-dev@python.org' },
]
license = {file = 'LICENSE'}
requires-python = '>=3.11'
dependencies = [
  "numpy>=1.26.0; python_version < '3.14'",
  # Earlier versions of NumPy are fundamentally broken on 3.14
  "numpy>=2.3.3; python_version >= '3.14'",
  "python-dateutil>=2.8.2",
  "tzdata; sys_platform == 'win32'",
  # Emscripten is the platform system for Pyodide.
  "tzdata; sys_platform == 'emscripten'",
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Environment :: Console',
    'Intended Audience :: Science/Research',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Cython',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
    'Topic :: Scientific/Engineering'
]

[project.urls]
homepage = 'https://pandas.pydata.org'
documentation = 'https://pandas.pydata.org/docs/'
repository = 'https://github.com/pandas-dev/pandas'

[project.entry-points."pandas_plotting_backends"]
matplotlib = "pandas:plotting._matplotlib"

[project.optional-dependencies]
test = ['hypothesis>=6.116.0', 'pytest>=8.3.4,<9.1', 'pytest-xdist>=3.6.1']
pyarrow = ['pyarrow>=13.0.0']
performance = ['bottleneck>=1.4.2', 'numba>=0.60.0', 'numexpr>=2.10.2']
computation = ['scipy>=1.14.1', 'xarray>=2024.10.0']
fss = ['fsspec>=2024.10.0']
aws = ['s3fs>=2024.10.0']
gcp = ['gcsfs>=2024.10.0']
excel = ['odfpy>=1.4.1', 'openpyxl>=3.1.5', 'python-calamine>=0.3.0', 'pyxlsb>=1.0.10', 'xlrd>=2.0.1', 'xlsxwriter>=3.2.0']
parquet = ['pyarrow>=13.0.0']
feather = ['pyarrow>=13.0.0']
iceberg = ['pyiceberg>=0.8.1']
hdf5 = ['tables>=3.10.1']
spss = ['pyreadstat>=1.2.8']
postgresql = ['SQLAlchemy>=2.0.36', 'psycopg2>=2.9.10', 'adbc-driver-postgresql>=1.2.0']
mysql = ['SQLAlchemy>=2.0.36', 'pymysql>=1.1.1']
sql-other = ['SQLAlchemy>=2.0.36', 'adbc-driver-postgresql>=1.2.0', 'adbc-driver-sqlite>=1.2.0']
html = ['beautifulsoup4>=4.12.3', 'html5lib>=1.1', 'lxml>=5.3.0']
xml = ['lxml>=5.3.0']
plot = ['matplotlib>=3.9.3']
output-formatting = ['jinja2>=3.1.5', 'tabulate>=0.9.0']
clipboard = ['PyQt5>=5.15.9', 'qtpy>=2.4.2']
compression = ['zstandard>=0.23.0']
timezone = ['pytz>=2020.1']
all = ['adbc-driver-postgresql>=1.2.0',
       'adbc-driver-sqlite>=1.2.0',
       'beautifulsoup4>=4.12.3',
       'bottleneck>=1.4.2',
