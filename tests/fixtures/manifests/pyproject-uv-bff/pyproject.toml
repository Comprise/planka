# источник: ~/Projects/bff/pyproject.toml (uv, [dependency-groups])
[project]
name = "bff"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
    "fastapi>=0.129.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "prometheus-client>=0.22.1",
    "pytest>=9.0.2",
    "strawberry-graphql>=0.308.3",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.1",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
# Общие настройки
line-length = 88
indent-width = 4
target-version = "py312"
preview = true
src = [
    "bff", 
    "core",
    "tests",
    "utils",
    "main.py",
]

[tool.ruff.lint]
# Настройки линтинга
extend-select = [
    "E",  # pycodestyle: включает E501 (слишком длинная строка), E502 (обратные слеши), E701-E703 (переносы/несколько операторов в строке)
    "F",  # pyflakes: включает F401 (неиспользуемые импорты)
    "I",  # isort: порядок импортов
    "W",  # pycodestyle предупреждения: включает W503 (перенос перед оператором) для некорректных переносов
]
fixable = [
    "F",  # pyflakes: включает F401 (неиспользуемые импорты)
    "I",  # isort: порядок импортов
]
ignore = [
    "ANN204",
    "ANN401"
]

[tool.ruff.format]
# Настройки форматирования (форматирование ruff)
quote-style = "single"  # форматирование кавычек
indent-style = "space"  # форматирование отступов
