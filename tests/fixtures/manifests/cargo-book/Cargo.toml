# источник: формы The Cargo Book, «Specifying Dependencies» (git, path, registry, переименование package,
# target cfg, dev/build, workspace = true) и «Workspaces» ([workspace.dependencies])
[package]
name = "hello_world"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["hello_utils"]

[workspace.dependencies]
rand = "0.8.5"

[dependencies]
time = "0.1.12"
regex = { git = "https://github.com/rust-lang/regex.git" }
hello_utils = { path = "hello_utils", version = "0.1.0" }
some-crate = { version = "1.0", registry = "my-registry" }
foo = "0.1"
bar = { git = "https://github.com/example/project.git", package = "foo" }
baz = { version = "0.1", registry = "custom", package = "Foo_Core" }
rand.workspace = true
serde = { version = "1.0", features = ["derive"] }
Libz_Sys = "1.1"

[target.'cfg(windows)'.dependencies]
winhttp = "0.4.0"

[target.'cfg(unix)'.dependencies]
openssl = "1.0.1"

[target.'cfg(target_arch = "x86")'.dependencies]
native-i686 = { path = "native/i686" }

[target.x86_64-pc-windows-gnu.dev-dependencies]
mio = "0.0.1"

[dev-dependencies]
tempdir = "0.3"

[build-dependencies]
cc = "1.0.3"

[features]
default = ["serde"]
